name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          release_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          git merge-base --is-ancestor "$release_commit" origin/main

      - name: Install tools with mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Verify tag signature
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gitsign verify-tag \
            --certificate-identity karl@laurits.dev \
            --certificate-oidc-issuer https://accounts.google.com \
            "$RELEASE_TAG"

      - name: Run checks
        run: mise run check

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cog changelog --at "$RELEASE_TAG" > release-notes.md

      - name: Build draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes release-notes.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --verify-tag
