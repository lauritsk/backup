# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

builds:
  - id: pimbackup
    main: ./cmd/pimbackup
    binary: pimbackup
    env: &build-env
      - CGO_ENABLED=0
    flags: &build-flags
      - -trimpath
    ldflags: &build-ldflags
      - >-
        -s -w
        -X github.com/lauritsk/backup/internal/buildinfo.Version={{ .Version }}
        -X github.com/lauritsk/backup/internal/buildinfo.Revision={{ .Commit }}
        -X github.com/lauritsk/backup/internal/buildinfo.BuildTime={{ .CommitDate }}
    mod_timestamp: &build-timestamp "{{ .CommitTimestamp }}"
  - id: appbackup
    main: ./cmd/appbackup
    binary: appbackup
    env: *build-env
    flags: *build-flags
    ldflags: *build-ldflags
    mod_timestamp: *build-timestamp

archives:
  - wrap_in_directory: true
    builds_info:
      mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: [zip]

source:
  enabled: true

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  disable: true

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  preflight:
    fail_on_error: true
